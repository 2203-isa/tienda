name: HH SmartClean AI - Compilar APK

on:
  push:
    branches: [hh-limpia-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hh-limpia
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Guardar informe (rama hh-limpia-log)
        if: always()
        shell: bash
        run: |
          {
            echo "# Compilación #${{ github.run_number }} — ${{ job.status }}"
            echo "Commit: ${{ github.sha }}"
            echo '```'
            grep -E "^e: |^w: .*(error)|error:|What went wrong|Could not|FAILURE|BUILD|Execution failed|Unresolved|Caused by" -A3 build.log | cut -c1-400 | head -300 || true
            echo '----- final del log -----'
            tail -80 build.log | cut -c1-400 || true
            echo '```'
          } > /tmp/informe.md
          ls -la app/build/outputs/apk/release/ >> /tmp/informe.md 2>&1 || true
          cd /tmp && rm -rf logrepo && mkdir logrepo && cd logrepo
          git init -q -b hh-limpia-log
          cp /tmp/informe.md informe.md
          git add informe.md
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Informe de compilación #${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hh-limpia-log

      - name: Publicar APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk HH-SmartClean-AI.apk
          gh release create "smartclean-1.0.${{ github.run_number }}" HH-SmartClean-AI.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "HH SmartClean AI 1.0.${{ github.run_number }} (app para limpiar el celular)" \
            --notes "App HH SmartClean AI (no es parte de la tienda). Descarga **HH-SmartClean-AI.apk** desde el celular e instálalo." \
            --prerelease
