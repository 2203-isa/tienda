name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Reportar error de compilación
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```'
            grep -E "^e: |error:|What went wrong|Could not|FAILURE|Execution failed" -A4 build.log | cut -c1-500 | head -250 || true
            echo '----- final del log -----'
            tail -60 build.log | cut -c1-500 || true
            echo '```'
          } | head -c 60000 > err.md
          gh issue create --title "Error de compilación #${{ github.run_number }}" --body-file err.md

      - name: Publicar APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk HH-Limpia.apk
          gh release create "v1.0.${{ github.run_number }}" HH-Limpia.apk \
            --title "HH Limpia 1.0.${{ github.run_number }}" \
            --notes "Descarga **HH-Limpia.apk** desde el celular e instálalo (permite 'instalar apps desconocidas' si Android lo pide)." \
            --latest
